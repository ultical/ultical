# SPA hosting for the AngularJS frontend. Mirrors the Apache .htaccess rewrite:
# real files/dirs are served as-is, everything else falls back to index.html so
# Angular's html5Mode routing (base href "/") works on hard refreshes.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache the vendored, content-stable assets.
    location /bower_components/ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
